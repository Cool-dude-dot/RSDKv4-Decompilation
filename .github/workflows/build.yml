name: Build RSDKv4 iOS Engine

on:
  workflow_dispatch:

jobs:
  package-engine:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Fetch Repository Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Xcode Platform Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Initialize Codebase Dependencies
        run: |
          if [ -f "./dependencies.sh" ]; then
            chmod +x ./dependencies.sh
            ./dependencies.sh
          else
            echo "No dependency script found, skipping step."
          fi

      - name: Compile Unsigned iOS Binary Framework
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Structure Native iOS IPA Payload
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "RSDKv4.app" -type d | head -n 1)
          if [ -d "$TARGET_APP" ]; then
            cp -r "$TARGET_APP" Payload/
          else
            cp -r build/Release-iphoneos/RSDKv4.app Payload/ || echo "Fallbacks failed"
          fi
          zip -r RSDKv4.ipa Payload

      - name: Publish Compiled Engine Package
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Engine
          path: RSDKv4.ipa
