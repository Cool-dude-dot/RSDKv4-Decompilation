name: RSDKv4 IPA Builder

on:
  workflow_dispatch: # Forces the manual "Run workflow" button to appear

jobs:
  build-ipa:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Download Framework Dependencies
        run: |
          chmod +x dependencies.sh
          ./dependencies.sh

      - name: Force Compile Without Apple Certificate
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package App to IPA
        run: |
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/RSDKv4.app Payload/
          zip -r rsdkv4.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-CD-RSDKv4
          path: rsdkv4.ipa
