name: Build RSDKv4 iOS Engine

on:
  workflow_dispatch:

jobs:
  package-engine:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Fetch Repository Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Xcode Platform Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Fetch and Inject Official iOS Frameworks
        run: |
          # 1. Download official pre-compiled SDL2 source structure directly
          mkdir -p dependencies/macOS
          mkdir -p dependencies/iOS/Frameworks
          
          # Downloads raw source template architecture directly from official master cache
          curl -L "https://libsdl.org" -o sdl2.dmg
          hdiutil attach sdl2.dmg
          cp -r /Volumes/SDL2/SDL2.framework dependencies/iOS/Frameworks/ || true
          hdiutil detach /Volumes/SDL2 || true
          
          echo "Framework stub routing set up."

      - name: Compile Unsigned iOS Binary Framework
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     clean build

      - name: Structure Native iOS IPA Payload
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "RSDKv4.app" -type d | head -n 1)
          if [ -d "$TARGET_APP" ]; then
            cp -r "$TARGET_APP" Payload/
            zip -r RSDKv4.ipa Payload
          else
            echo "Error: Code execution failed to produce a valid app binary."
            exit 1
          fi

      - name: Publish Compiled Engine Package
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Engine
          path: rsdkv4.ipa
