name: Fast iOS IPA Generator

on:
  workflow_dispatch:

jobs:
  compile-ios:
    runs-on: macos-13
    timeout-minutes: 10 # Kills it immediately if it takes more than 10 mins so you don't wait 6 hours

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Compile iOS Frameworks Natively
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Raw App Directory into Sideloadable IPA
        run: |
          mkdir -p Payload
          # Copies the fresh engine build layout safely into the installer package stage
          cp -r build/*.app Payload/ 2>/dev/null || cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
          zip -r rsdkv4.ipa Payload

      - name: Upload iOS Game Installer
        uses: actions/upload-artifact@v4
        with:
          name: rsdkv4-ios-app
          path: rsdkv4.ipa
