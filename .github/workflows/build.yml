name: Build RSDKv4 iOS Engine

on:
  workflow_dispatch:

jobs:
  package-engine:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Fetch Main Engine Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Companion Game Scripts Natively
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv4-Script-Decompilation
          path: scripts_temp

      - name: Inject Missing Native Headers
        run: |
          mkdir -p RSDKv4
          cp -r scripts_temp/NativeObjects/* RSDKv4/ 2>/dev/null || cp -r scripts_temp/* RSDKv4/ || echo "Moving files directly"
          echo "Native objects successfully injected."

      - name: Install Build Tools and Dependencies
        run: |
          brew install cmake ninja sdl2 libogg libvorbis tinyxml2
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png

      - name: Force Code Patch for iOS Architecture
        run: |
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/#include <OpenGL\/gl.h>/#include <OpenGLES\/ES2\/gl.h>/g' {} +
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/#include <OpenGL\/glext.h>/\/\/ #include <OpenGL\/glext.h>/g' {} +
          echo "All source files successfully forced into mobile graphics configuration."

      - name: Compile Natively via CMake
        run: |
          # Uses CMake to bypass Xcode internal engine errors and builds directly for arm64 iOS hardware
          cmake -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DRETRO_MOBILE=ON \
            -DRSDK_MOBILE=ON \
            -DRSDK_USE_GLES=ON \
            -DSDL2_INCLUDE_DIR=/opt/homebrew/opt/sdl2/include \
            -DSDL2_LIBRARY=/opt/homebrew/opt/sdl2/lib/libSDL2.dylib
          
          cmake --build build --config Release

      - name: Structure Native iOS IPA Payload
        run: |
          mkdir -p Payload
          # Searches for the real compiled executable .app binary produced by CMake
          TARGET_APP=$(find build -name "*.app" -type d | head -n 1)
          if [ -d "$TARGET_APP" ]; then
            cp -r "$TARGET_APP" Payload/
            zip -r rsdkv4.ipa Payload
          else
            echo "Error: CMake compilation did not output a valid binary framework."
            exit 1
          fi

      - name: Publish Compiled Engine Package
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Engine
          path: rsdkv4.ipa
