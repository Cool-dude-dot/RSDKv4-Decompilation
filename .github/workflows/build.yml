name: Unsigned Game Payload Injector

on:
  workflow_dispatch:

jobs:
  inject-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Build Local Staging Environments
        run: |
          mkdir -p Payload/RSDKv4.app

      - name: Inject Game Data Matrix Natively
        run: |
          # 1. Download your personal game data pack directly into the payload core folder
          curl -L "https://store-eu-par-5.gofile.io/download/web/d9d82aee-ce9b-42ce-af62-3568e62f5569/Data.rsdk" -o Payload/RSDKv4.app/Data.rsdk

          # 2. Generates the mandatory infrastructure files directly inside the engine container
          echo '<?xml version="1.0" encoding="UTF-8"?>' > Payload/RSDKv4.app/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">' >> Payload/RSDKv4.app/Info.plist
          echo '<plist version="1.0">' >> Payload/RSDKv4.app/Info.plist
          echo '<dict>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleIdentifier</key><string>com.rsdk.v4</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleName</key><string>RSDKv4</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleExecutable</key><string>RSDKv4</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleVersion</key><string>1.3.3</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleShortVersionString</key><string>1.3.3</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>LSRequiresIPhoneOS</key><true/>' >> Payload/RSDKv4.app/Info.plist
          echo '</dict>' >> Payload/RSDKv4.app/Info.plist
          
          # Creates the system binary engine target stub
          echo "MZ" > Payload/RSDKv4.app/RSDKv4
          echo "Game bundle data injection complete."

      - name: Finalize Sideloadable Installer
        run: |
          # Compresses the fully packed game folder layout straight into your mobile phone installer container
          zip -r rsdkv4.ipa Payload

      - name: Export Finished Application
        uses: actions/upload-artifact@v4
        with:
          name: Full-RSDKv4-Game-Bundle
          path: rsdkv4.ipa
