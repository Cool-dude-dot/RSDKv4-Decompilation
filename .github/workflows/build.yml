name: Build RSDKv4 iOS Engine

on:
  workflow_dispatch:

jobs:
  package-engine:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Fetch Repository Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Xcode Platform Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install System Engine Modules
        run: |
          brew install sdl2 libogg libvorbis
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png
          echo "Placeholder assets generated successfully."

      - name: Patch OpenGL Headers for iOS Architecture
        run: |
          # Replaces the desktop Mac graphics framework links with the mobile iPhone graphics framework links
          sed -i '' 's/#include <OpenGL\/gl.h>/#include <OpenGLES\/ES2\/gl.h>/g' RSDKv4/RetroEngine.hpp
          sed -i '' 's/#include <OpenGL\/glext.h>/\/\/ #include <OpenGL\/glext.h>/g' RSDKv4/RetroEngine.hpp
          echo "Graphics pipeline patched for mobile deployment."

      - name: Compile Unsigned iOS Binary Framework
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     HEADER_SEARCH_PATHS="/opt/homebrew/opt/sdl2/include /opt/homebrew/opt/libogg/include /opt/homebrew/opt/libvorbis/include" \
                     LIBRARY_SEARCH_PATHS="/opt/homebrew/opt/sdl2/lib /opt/homebrew/opt/libogg/lib /opt/homebrew/opt/libvorbis/lib" \
                     clean build

      - name: Structure Native iOS IPA Payload
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "RSDKv4.app" -type d | head -n 1)
          if [ -d "$TARGET_APP" ]; then
            cp -r "$TARGET_APP" Payload/
            zip -r RSDKv4.ipa Payload
          else
            echo "Error: Code execution failed to produce a valid app binary."
            exit 1
          fi

      - name: Publish Compiled Engine Package
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Engine
          path: rsdkv4.ipa
