name: Build RSDKv4 iOS Engine

on:
  workflow_dispatch:

jobs:
  package-engine:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Fetch Main Engine Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Companion Game Scripts Natively
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv4-Script-Decompilation
          path: scripts_temp

      - name: Force Map and Bridge Header Repositories
        run: |
          # 1. Structures absolute folder roots for all compilation targets
          mkdir -p RSDKv4
          mkdir -p RSDKv4/NativeObjects
          
          # 2. Automatically locates NativeObjects.hpp and duplicates it across all search layers
          find scripts_temp -name "NativeObjects.hpp" -exec cp -v {} ./ \;
          find scripts_temp -name "NativeObjects.hpp" -exec cp -v {} ./RSDKv4/ \;
          find scripts_temp -name "NativeObjects.hpp" -exec cp -v {} ./RSDKv4/NativeObjects/ \;
          
          # 3. Blends all accompanying header file definitions to guarantee no file drops
          find scripts_temp -name "*.hpp" -exec cp -v {} ./RSDKv4/ \; 2>/dev/null || true
          find scripts_temp -name "*.h" -exec cp -v {} ./RSDKv4/ \; 2>/dev/null || true
          
          # 4. System-level global fallbacks for Xcode include parameters
          sudo find scripts_temp -name "NativeObjects.hpp" -exec cp -v {} /Applications/Xcode_15.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS17.5.sdk/usr/include/ \;
          
          echo "All script architecture headers successfully integrated."

      - name: Configure Xcode Platform Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install System Engine Modules
        run: |
          brew install sdl2 libogg libvorbis tinyxml2
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png
          echo "Staging checks cleared."

      - name: Force Code Patch for iOS Architecture
        run: |
          # Recursively sanitizes desktop graphic bindings out of all engine code files
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/#include <OpenGL\/gl.h>/#include <OpenGLES\/ES2\/gl.h>/g' {} +
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/#include <OpenGL\/glext.h>/\/\/ #include <OpenGL\/glext.h>/g' {} +
          echo "All code references successfully optimized for target hardware processing profiles."

      - name: Compile Unsigned iOS Binary Framework
        run: |
          # Links local directories, sub-directories, and framework trees straight into the compiler paths
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     GCC_PREPROCESSOR_DEFINITIONS="RSDK_MOBILE=1 RETRO_MOBILE=1 RSDK_USE_GLES=1" \
                     HEADER_SEARCH_PATHS="/opt/homebrew/opt/sdl2/include /opt/homebrew/opt/libogg/include /opt/homebrew/opt/libvorbis/include /opt/homebrew/opt/tinyxml2/include . ./RSDKv4 ./RSDKv4/NativeObjects" \
                     LIBRARY_SEARCH_PATHS="/opt/homebrew/opt/sdl2/lib /opt/homebrew/opt/libogg/lib /opt/homebrew/opt/libvorbis/lib /opt/homebrew/opt/tinyxml2/lib" \
                     clean build

      - name: Structure Native iOS IPA Payload
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "RSDKv4.app" -type d | head -n 1)
          if [ -d "$TARGET_APP" ]; then
            cp -r "$TARGET_APP" Payload/
            zip -r RSDKv4.ipa Payload
          else
            echo "Error: Application bundle compilation failure encountered."
            exit 1
          fi

      - name: Publish Compiled Engine Package
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Engine
          path: rsdkv4.ipa
