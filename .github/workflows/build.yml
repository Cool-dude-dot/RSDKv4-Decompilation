name: Build RSDKv4 iOS IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build-ios:
    runs-on: macos-13
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically pulls down required dependencies

      - name: Set up Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcode-select -p

      - name: Run Project Dependencies Script
        run: |
          chmod +x dependencies.sh
          ./dependencies.sh

      - name: Build Xcode Project
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package App Folder into Unsigned IPA
        run: |
          mkdir -p Payload
          # Locates the compiled bundle output directory and copies it to the Payload stage
          cp -r build/Release-iphoneos/RSDKv4.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/RSDKv4.app Payload/
          zip -r rsdkv4.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsdkv4-ios-ipa
          path: rsdkv4.ipa
