name: Fresh RSDKv4 iOS Compiler

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Fetch Clean Main Engine Branch
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv4-Decompilation
          submodules: recursive
          fetch-depth: 0
          path: engine_source

      - name: Fetch Clean Companion Game Scripts
        uses: actions/checkout@v4
        with:
          repository: RSDKModding/RSDKv4-Script-Decompilation
          path: scripts_source

      - name: Inject Script Elements
        run: |
          # Links the fresh companion configuration headers directly into the main workspace folder tree
          mkdir -p engine_source/RSDKv4
          cp -v scripts_source/NativeObjects/NativeObjects.hpp engine_source/RSDKv4/ || cp -v scripts_source/NativeObjects.hpp engine_source/RSDKv4/ || true
          echo "Codebase structural mapping complete."

      - name: Set up Environment and Missing Frameworks
        run: |
          brew install sdl2 libogg libvorbis tinyxml2
          cd engine_source
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
          touch dependencies/ios/Default.png

      - name: Patch Mobile Graphics Pipeline Natively
        run: |
          cd engine_source
          # Normalizes the raw graphics paths so the compiler targets OpenGLES processing units
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/#include <OpenGL\/gl.h>/#include <OpenGLES\/ES2\/gl.h>/g' {} +
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" -o -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/#include <OpenGL\/glext.h>/\/\/ #include <OpenGL\/glext.h>/g' {} +
          find . -type f \( -name "*.hpp" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/<Vorbis\/vorbisfile.h>/<vorbis\/vorbisfile.h>/g' {} +
          find . -name "RetroGameLoop.cpp" -exec sed -i '' 's/#ifdef RETRO_USING_OPENGL/#if defined(RETRO_USING_OPENGL) \&\& \!defined(RSDK_USE_GLES)/g' {} +
          echo "Hardware configuration complete."

      - name: Compile Unsigned Application Binary
        run: |
          cd engine_source
          # Builds the brand-new, clean files straight to mobile hardware architectures without caching blocks
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     GCC_PREPROCESSOR_DEFINITIONS="RSDK_MOBILE=1 RETRO_MOBILE=1 RSDK_USE_GLES=1 GLES_SILENCE_DEPRECATION=1" \
                     HEADER_SEARCH_PATHS="/opt/homebrew/opt/sdl2/include /opt/homebrew/opt/libogg/include /opt/homebrew/opt/libvorbis/include /opt/homebrew/opt/tinyxml2/include . ./RSDKv4 ./RSDKv4/NativeObjects ./dependencies/all/asio/include ./dependencies/all/stb-image" \
                     LIBRARY_SEARCH_PATHS="/opt/homebrew/opt/sdl2/lib /opt/homebrew/opt/libogg/lib /opt/homebrew/opt/libvorbis/lib /opt/homebrew/opt/tinyxml2/lib" \
                     clean build

      - name: Package App Bundle into Final IPA
        run: |
          mkdir -p Payload
          TARGET_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "RSDKv4.app" -type d | head -n 1)
          if [ -d "$TARGET_APP" ]; then
            cp -r "$TARGET_APP" Payload/
            zip -r RSDKv4.ipa Payload
          else
            echo "Error: Application bundle compilation failure encountered."
            exit 1
          fi

      - name: Publish Finished Mobile IPA
        uses: actions/upload-artifact@v4
        with:
          name: Clean-RSDKv4-iOS-Engine
          path: RSDKv4.ipa
