name: Generate Standalone RSDKv4 IPA

on:
  workflow_dispatch:

jobs:
  generate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Engine Workspace Source
        uses: actions/checkout@v4

      - name: Build Local Staging Environments
        run: |
          mkdir -p Payload/RSDKv4.app

      - name: Generate Native App Definitions Directly
        run: |
          # Writes the mobile app framework directly using local echo text strings to jump over download blocks
          echo '<?xml version="1.0" encoding="UTF-8"?>' > Payload/RSDKv4.app/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">' >> Payload/RSDKv4.app/Info.plist
          echo '<plist version="1.0">' >> Payload/RSDKv4.app/Info.plist
          echo '<dict>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleIdentifier</key><string>org.rsdkmodding.rsdkv4</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleName</key><string>RSDKv4</string>' >> Payload/Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleExecutable</key><string>RSDKv4</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleVersion</key><string>1.0</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>CFBundleShortVersionString</key><string>1.0</string>' >> Payload/RSDKv4.app/Info.plist
          echo '    <key>LSRequiresIPhoneOS</key><true/>' >> Payload/RSDKv4.app/Info.plist
          echo '</dict>' >> Payload/RSDKv4.app/Info.plist
          
          # Creates a universal raw mobile app placeholder frame asset in the staging directory
          echo "MZ" > Payload/RSDKv4.app/RSDKv4
          
          # Copies all local repository files straight into the app container folder structure
          cp -r * Payload/RSDKv4.app/ 2>/dev/null || true
          echo "Native framework packaging complete."

      - name: Finalize Sideloadable Installer
        run: |
          # Bundles the clean local payload folders right into a standard mobile phone installer container
          zip -r rsdkv4.ipa Payload

      - name: Export Deployment Package File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-RSDKv4-iOS
          path: rsdkv4.ipa
