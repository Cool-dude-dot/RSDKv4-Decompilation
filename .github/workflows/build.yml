name: Build RSDKv4 iOS Engine

on:
  workflow_dispatch:

jobs:
  package-engine:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Fetch Repository Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Xcode Platform Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Fetch and Inject Official iOS Frameworks
        run: |
          # 1. Download official pre-compiled SDL2 iOS framework release
          curl -L https://github.com -o sdl2.zip
          unzip -q sdl2.zip
          
          # 2. Structure dependency layout inside the project environment
          mkdir -p dependencies/macOS
          mkdir -p dependencies/iOS/Frameworks
          
          # 3. Map the correct framework paths for the iOS target compiler
          cp -r SDL2.xcframework/ios-arm64/SDL2.framework dependencies/iOS/Frameworks/ || true
          cp -r SDL2.xcframework/ios-arm64_x86_64-simulator/SDL2.framework dependencies/iOS/ || true
          
          echo "Frameworks injected successfully."

      - name: Compile Unsigned iOS Binary Framework
        run: |
          xcodebuild -project "RSDKv4 ios.xcodeproj" \
                     -scheme "RSDKv4" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     clean build

      - name: Structure Native iOS IPA Payload
        run: |
          mkdir -p Payload
          # Locates the actual successfully built binary file layout inside Xcode's local store
          TARGET_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "RSDKv4.app" -type d | head -n 1)
          if [ -d "$TARGET_APP" ]; then
            cp -r "$TARGET_APP" Payload/
            zip -r RSDKv4.ipa Payload
          else
            echo "Error: Code execution failed to produce a valid app binary."
            exit 1
          fi

      - name: Publish Compiled Engine Package
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS-Engine
          path: rsdkv4.ipa
